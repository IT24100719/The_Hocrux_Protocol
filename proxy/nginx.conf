worker_processes 1;
events { worker_connections 1024; }

http {
    client_max_body_size 50M;
    sendfile on;

    upstream ctfd  { server ctfd:8000; }
    upstream hx02  { server hx02-web:5000; }

    server {
        listen 80;
        root /usr/share/nginx/html;

        # Loading screen shown while the stack is provisioning (the seeder has
        # not yet created /run/horcrux/ready) or while CTFd is restarting (502).
        location @loading {
            default_type text/html;
            add_header Cache-Control "no-store" always;
            try_files /loading.html =503;
        }

        # Readiness probe the loading page polls; NOT routed to @loading so it can
        # truthfully return 503 until provisioning finishes.
        location = /horcrux-ready {
            if (!-f /run/horcrux/ready) { return 503; }
            default_type text/plain;
            return 200 "ready";
        }

        location /chamber {
            error_page 502 503 504 = @loading;
            if (!-f /run/horcrux/ready) { return 503; }
            proxy_pass         http://hx02;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Soundtrack files (optional). Drop .mp3s into ./audio on the host and
        # they serve here, e.g. /audio/ambient.mp3. Served statically from root
        # (/usr/share/nginx/html/audio); 404 while the folder is empty, which is
        # harmless — the player only starts when scenes.json audio.enabled=true.
        location /audio/ {
            types { audio/mpeg mp3; audio/ogg ogg; audio/mp4 m4a; }
            default_type audio/mpeg;
            add_header Cache-Control "public, max-age=3600";
            access_log off;
        }

        location / {
            error_page 502 503 504 = @loading;
            if (!-f /run/horcrux/ready) { return 503; }   # provisioning -> loading screen
            proxy_pass         http://ctfd;
            # Pass the host *with* its port ($http_host, not $host) so CTFd
            # builds absolute redirects (e.g. the 302 to /setup) that keep the
            # :8000 port. With bare $host the port is dropped and the browser
            # follows the redirect to port 80 -> connection refused.
            proxy_set_header   Host $http_host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Host $http_host;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
